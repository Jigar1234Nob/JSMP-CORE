currency:
  symbol: "$"
  starting-balance: 100.00
  decimal-places: 2

shop:
  title: "&8JSMP Shop"
  items-per-page: 45
  allow-shift-stack-buy: true

sell:
  title: "&8Sell Items"
  confirm-slot: 49
  sell-multiplier: 1.0
  unknown-items-sellable: false

auction-house:
  enabled: true
  # Maximum number of active listings each player can have.
  max-active-listings: 5
  # Listings expire after this many hours. Expired items can be collected with /ah claims.
  listing-expiry-hours: 48

economy:
  # Default sell price as a fraction of the buy price for migrated/new items.
  default-sell-rate: 0.5
  # Internal migration markers. Keep true for new installations.
  high-price-migration-v1: true
  low-value-price-migration-v2: true
  buy-sell-price-migration-v1: true
  # One-time migration updates untouched generated prices using crafting recipes.
  recipe-pricing-migration-v1: false
  baltop-size: 10
  minimum-payment: 0.01

messages:
  prefix: "&8[&6JSMP&8] &r"

# Built-in lightweight server-side cheat checks.
# This is not a replacement for a dedicated packet-level anti-cheat.
anti-cheat:
  enabled: true
  check-reach: true
  check-fast-break: true
  # Movement checks are opt-in because latency, knockback and server mechanics can cause false positives.
  check-movement: false
  max-reach: 4.2
  max-block-breaks-per-second: 28
  max-horizontal-move-per-event: 1.25
  # A player is kicked after this many flags within 60 seconds. Set to 0 for alerts/logging only.
  punish-threshold: 5

# Random teleport settings. RTP samples the playable area inside the world's border.
rtp:
  world: "world"
  min-radius: 500
  max-radius: 0
  border-margin: 16
  attempts: 32
  # Blindness duration after RTP, in ticks (100 ticks = 5 seconds).
  blindness-duration-ticks: 100

# Maintenance mode can also be toggled with /maintenance.
maintenance:
  enabled: false

# Daily login rewards. Only time spent online outside /afk counts.
# The reward calendar contains unique prizes for its 30-day cycle.
daily:
  base-play-minutes: 10
  extra-minutes-per-streak-day: 5
  maximum-play-minutes: 120
