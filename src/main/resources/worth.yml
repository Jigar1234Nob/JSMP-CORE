# JSMPCore survival shop prices.
# Missing survival items are added automatically using vanilla recipe costs and the configured shop premium.
# Untouched prices from older generated catalogues are migrated once; owner-customised prices are preserved.
# Sell prices default to 35% of buy prices. Set sellable: false to disable an item.
items:
  DIAMOND:
    buy-price: 90000.0
    sell-price: 45000.0
    sellable: true
  EMERALD:
    buy-price: 60000.0
    sell-price: 30000.0
    sellable: true
  DIRT:
    buy-price: 40.0
    sell-price: 20.0
    sellable: true
