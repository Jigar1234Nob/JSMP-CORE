# Curated JSMPCore shop prices.
# Blocks remain available. Only common resources, farming supplies and food are included alongside blocks.
# Netherite, weapons, armour, tools, potions and rare or unnecessary items are excluded.
# Every item price is at least $1,001 before the configured economy multiplier. Disabled admin-only items keep sellable: false.
# Set sellable to false or price to 0.0 to disable buying and selling.
items:
  DIAMOND:
    price: 90000.0
    sellable: true
  EMERALD:
    price: 60000.0
    sellable: true
  DIRT:
    price: 1001.0
    sellable: true
  BEDROCK:
    price: 1001.0
    sellable: false
  BARRIER:
    price: 1001.0
    sellable: false
