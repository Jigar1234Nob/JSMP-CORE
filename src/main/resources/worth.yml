# JSMPCore item prices.
# Prices below are base values. economy.price-multiplier in config.yml applies to buying, selling and lore.
# Rare special items (Elytra, Totems, Nether Stars, Shulker Boxes, etc.) are automatically disabled.
# Set sellable to false or price to 0.0 to disable buying and selling.
items:
  DIAMOND:
    price: 90.0
    sellable: true
  EMERALD:
    price: 60.0
    sellable: true
  NETHERITE_INGOT:
    price: 250.0
    sellable: true
  DIRT:
    price: 0.25
    sellable: true
  BEDROCK:
    price: 0.0
    sellable: false
  BARRIER:
    price: 0.0
    sellable: false
