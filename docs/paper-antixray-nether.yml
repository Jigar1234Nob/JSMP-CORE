# Merge this anticheat.anti-xray section into the Nether world's paper-world.yml.
# Example location: world_nether/paper-world.yml (use your actual Nether world folder).
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 2
    hidden-blocks:
      - ancient_debris
      - nether_gold_ore
      - nether_quartz_ore
    replacement-blocks:
      - netherrack
      - basalt
      - blackstone
      - gravel
      - soul_sand
      - soul_soil
    lava-obscures: false
    max-block-height: 128
    update-radius: 2
    use-permission: false

# Restart Paper after editing. Do not use /reload.
